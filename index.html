<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>QRコード作成・解読ツール</title>
  <style>
    /* Hallmark · pre-emit critique: P4 H3 E5 S5 R5 V3 */
    /* Hallmark · component: QR generation workbench · genre: atmospheric · theme: existing cyan
     * states: default · hover · focus · active · disabled · loading · error · success
     * contrast: pass (WCAG 2.1 scoped minimum 7.15:1)
     */
    /* 全体スタイル */
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: auto;
      background: #0a0a1e;
    }
    /* コンテナ */
    .container {
      background-color: rgba(0,0,0,0.8);
      border: 2px solid rgba(111,195,223,0.5);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(111,195,223,0.4);
      padding: 2rem;
      max-width: 600px;
      width: 90%;
      box-sizing: border-box;
      text-align: center;
      margin: 1rem;
    }
    /* 各セクション枠 */
    .section {
      border: 1px solid #6fc3df;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 2rem;
    }
    /* モバイル対応 */
    @media (max-width: 480px) {
      .container { padding: 1rem; }
      button.action { padding-inline: 0.8rem; font-size: 0.9rem; }
    }
    #lang-switch { text-align: right; margin-bottom: 1rem; }
    #lang-btn {
      background: none;
      border: 1px solid #6fc3df;
      color: #6fc3df;
      min-width: 44px;
      min-height: 44px;
      padding: 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }
    #lang-btn:hover { background-color: rgba(111,195,223,0.2); }
    h1 { margin: 0.5rem 0; }
    .field {
      width: 100%;
      margin: 0.75rem auto;
      text-align: left;
    }
    .field-label {
      display: block;
      margin-bottom: 0.25rem;
      color: #e0f7fa;
      font-weight: bold;
    }
    input[type=text] {
      width: 100%;
      padding: 0.5rem;
      min-height: 44px;
      margin: 0;
      border: 1px solid #6fc3df;
      border-radius: 4px;
      background: #222;
      color: #e0f7fa;
      box-sizing: border-box;
    }
    input[type=text][aria-invalid="true"] {
      border-color: #ffb3b3;
    }
    .helper {
      min-height: 1.4em;
      margin: 0.25rem 0 0;
      color: #9fdae9;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .helper[data-state="error"],
    .helper[data-state="failed"] {
      color: #ffb3b3;
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    button.action {
      display: inline-block;
      min-height: 44px;
      margin: 0.5rem 0;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background-color: #6fc3df;
      color: #002f3e;
      white-space: nowrap;
      transition: background-color 120ms, transform 120ms;
    }
    button.action:hover {
      background-color: #8ed5e6;
    }
    button.action:active { transform: translateY(1px); }
    button.action:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    button.action.secondary {
      border: 1px solid #6fc3df;
      background: transparent;
      color: #9fdae9;
    }
    button.action.secondary:hover { background: rgba(111,195,223,0.12); }
    #lang-btn:focus-visible,
    input[type=text]:focus-visible {
      outline: 3px solid #8ed5e6;
      outline-offset: 3px;
    }
    button.action:focus-visible {
      outline: 3px solid #002f3e;
      outline-offset: 0;
      box-shadow: 0 0 0 5px #fff;
    }
    [hidden] { display: none !important; }
    canvas {
      display: block;
      margin: 1rem auto;
      border: 1px solid #6fc3df;
      border-radius: 4px;
      background: #000;
      box-sizing: border-box;
      max-width: 100%;
      height: auto;
    }
    .qr-preview {
      display: grid;
      width: min(100%, 256px);
      aspect-ratio: 1;
      margin: 1rem auto 0;
      place-items: center;
      border: 1px dashed #6fc3df;
      border-radius: 4px;
      background: rgba(111,195,223,0.05);
      box-sizing: border-box;
    }
    .qr-preview[data-state="ready"],
    .qr-preview[data-state="downloaded"] {
      border-style: solid;
      background: #fff;
    }
    .qr-preview canvas {
      width: 100%;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: #fff;
    }
    .preview-empty {
      max-width: 18ch;
      margin: 0;
      color: #9fdae9;
      line-height: 1.5;
    }
    #generate-status { text-align: center; }
    #result {
      text-align: center;
      font-weight: bold;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      margin-top: 1rem;
      background-color: rgba(255,235,59,0.2);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 1.1rem;
      color: #fff; /* 読みやすい白文字 */
    }
    #result:empty { display: none; }
    #result[data-state="invalidFile"],
    #result[data-state="readFailed"],
    #result[data-state="imageFailed"] {
      border: 1px solid #ffb3b3;
      background-color: rgba(120,20,20,0.35);
      color: #ffe3e3;
    }
    #drop-zone {
      display: flex;
      min-height: 132px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.5rem;
      border: 2px dashed #6fc3df;
      border-radius: 8px;
      padding: 2rem;
      margin: 0.5rem auto;
      color: #6fc3df;
      transition: border-color 180ms, color 180ms, background-color 180ms;
      background: rgba(111,195,223,0.05);
      width: 80%;
      box-sizing: border-box;
      cursor: pointer;
    }
    #drop-zone.hover,
    #drop-zone:focus-within {
      border-color: #fff;
      color: #fff;
    }
    #drop-zone:focus-within {
      outline: 3px solid #8ed5e6;
      outline-offset: 3px;
    }
    #drop-zone:active {
      background: rgba(111,195,223,0.12);
    }
    #drop-zone:has(input:disabled) {
      opacity: 0.55;
      cursor: not-allowed;
    }
    #drop-zone[data-state="loading"] {
      border-style: solid;
      cursor: progress;
    }
    #drop-zone[data-state="error"] {
      border-color: #ffb3b3;
    }
    #drop-zone[data-state="success"] {
      border-style: solid;
    }
    @media (hover: hover) and (pointer: fine) {
      #drop-zone:hover {
        border-color: #fff;
        color: #fff;
      }
    }
    .drop-zone-action {
      color: #e0f7fa;
      font-weight: bold;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      button.action { transition: none; }
      button.action:active { transform: none; }
      #drop-zone { transition: none; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div id="lang-switch"><button id="lang-btn">EN</button></div>
    <h1 id="title">QRコード作成・解読ツール</h1>

    <div class="section" id="generate">
      <h2 id="gen-title">生成</h2>
      <div class="field">
        <label id="text-label" class="field-label" for="text-input">QRコードにするテキスト</label>
        <input id="text-input" type="text" placeholder="例: https://example.com" aria-describedby="text-helper generate-status" aria-invalid="false">
        <p id="text-helper" class="helper">先頭や末尾の空白も入力どおりに保存されます</p>
      </div>
      <div class="button-row">
        <button id="generate-btn" class="action">QRコードを生成</button>
        <button id="download-btn" class="action secondary" hidden>PNGを保存</button>
      </div>
      <div id="generate-preview" class="qr-preview" data-state="empty">
        <p id="preview-empty" class="preview-empty">生成したQRコードがここに表示されます</p>
        <canvas id="generate-canvas" hidden width="256" height="256" draggable="true" aria-label="生成されたQRコード"></canvas>
      </div>
      <p id="generate-status" class="helper" role="status" aria-live="polite"></p>
      <p id="hint" style="font-size:0.9rem; color:#6fc3df;">生成したQRコードをドラッグして解読エリアにドロップできます</p>
    </div>

    <div class="section" id="decode">
      <h2 id="dec-title">解読</h2>
      <label id="drop-zone" for="file-input" data-state="empty" aria-busy="false">
        <span id="drop-zone-text">ここに画像をドロップ</span>
        <span id="drop-zone-action" class="drop-zone-action" aria-hidden="true">画像を選択</span>
        <input id="file-input" class="visually-hidden" type="file" accept="image/*" aria-describedby="result">
      </label>
      <div class="button-row">
        <button id="reset-btn" class="action">リセット</button>
      </div>
      <canvas id="decode-canvas" hidden width="200" height="200" aria-label="解読に使用した画像"></canvas>
      <p id="result" role="status" aria-live="polite" data-state="empty"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
  <script>
    // 多言語テキスト
    const texts = {
      ja: {
        title: 'QRコード作成・解読ツール',
        genTitle: '生成',
        decTitle: '解読',
        inputLabel: 'QRコードにするテキスト',
        inputPlaceholder: '例: https://example.com',
        inputHelper: '先頭や末尾の空白も入力どおりに保存されます',
        inputRequired: 'テキストが空です。QRコードにする内容を入力してください。',
        generateBtn: 'QRコードを生成',
        generating: '生成中…',
        generated: count => `QRコードを生成しました（${count}文字）`,
        generationFailed: 'QRコードを生成できませんでした。入力を短くして、もう一度お試しください。',
        previewEmpty: '生成したQRコードがここに表示されます',
        previewLabel: '生成されたQRコード',
        decodeCanvasLabel: '解読に使用した画像',
        downloadBtn: 'PNGを保存',
        downloaded: 'QRコードをPNGで保存しました',
        hint: '生成したQRコードをドラッグして解読エリアにドロップできます',
        dropZone: 'ここに画像をドロップ',
        fileBtn: '画像を選択',
        resetBtn: 'リセット',
        decoding: '画像を読み込んでいます…',
        decoded: '解読結果: ',
        notFound: 'QRコードが見つかりませんでした。QRコード全体が写った鮮明な画像を選択してください。',
        invalidFile: '画像ファイルではありません。PNG、JPEG、GIF、WebPなどの画像を選択してください。',
        readFailed: '画像ファイルを読み込めませんでした。別の画像を選択してください。',
        imageFailed: 'この画像を開けませんでした。別の画像ファイルを選択してください。',
        switchLanguage: 'Switch to English'
      },
      en: {
        title: 'QR Code Generator & Reader',
        genTitle: 'Generate',
        decTitle: 'Decode',
        inputLabel: 'Text to encode',
        inputPlaceholder: 'Example: https://example.com',
        inputHelper: 'Leading and trailing spaces are preserved exactly',
        inputRequired: 'The text is empty. Enter the content to encode.',
        generateBtn: 'Generate QR Code',
        generating: 'Generating…',
        generated: count => `QR code ready (${count} characters)`,
        generationFailed: 'The QR code could not be generated. Shorten the input and try again.',
        previewEmpty: 'Your generated QR code will appear here',
        previewLabel: 'Generated QR code',
        decodeCanvasLabel: 'Image used for decoding',
        downloadBtn: 'Save PNG',
        downloaded: 'QR code saved as a PNG',
        hint: 'Drag the generated QR code here to decode it',
        dropZone: 'Drop an image here',
        fileBtn: 'Choose an image',
        resetBtn: 'Reset',
        decoding: 'Reading the image…',
        decoded: 'Decoded: ',
        notFound: 'No QR code was found. Choose a clear image that shows the complete QR code.',
        invalidFile: 'That file is not an image. Choose a PNG, JPEG, GIF, WebP, or another image file.',
        readFailed: 'The image file could not be read. Choose another image.',
        imageFailed: 'The image could not be opened. Choose another image file.',
        switchLanguage: '日本語に切り替える'
      }
    };
    let lang = 'ja';
    let generationState = 'empty';
    let generatedText = '';
    let decodedState = 'empty';
    let decodedData = '';
    let decodeRequestId = 0;

    // QR生成と解読
    const langBtnEl = document.getElementById('lang-btn');
    const generateBtnEl = document.getElementById('generate-btn');
    const downloadBtnEl = document.getElementById('download-btn');
    const textInputEl = document.getElementById('text-input');
    const textLabelEl = document.getElementById('text-label');
    const textHelperEl = document.getElementById('text-helper');
    const generatePreviewEl = document.getElementById('generate-preview');
    const previewEmptyEl = document.getElementById('preview-empty');
    const generateStatusEl = document.getElementById('generate-status');
    const generateCanvasEl = document.getElementById('generate-canvas');
    const generateCtxEl = generateCanvasEl.getContext('2d', { willReadFrequently: true });
    const fileInputEl = document.getElementById('file-input');
    const resetBtnEl = document.getElementById('reset-btn');
    const decodeCanvasEl = document.getElementById('decode-canvas');
    const decodeCtxEl = decodeCanvasEl.getContext('2d', { willReadFrequently: true });
    const resultPEl = document.getElementById('result');
    const dropZoneEl = document.getElementById('drop-zone');
    const dropZoneTextEl = document.getElementById('drop-zone-text');
    const dropZoneActionEl = document.getElementById('drop-zone-action');

    function renderGenerationState() {
      const t = texts[lang];
      const hasPreview = generationState === 'ready' || generationState === 'downloaded';
      generateBtnEl.disabled = generationState === 'generating';
      generateBtnEl.textContent = generationState === 'generating' ? t.generating : t.generateBtn;
      downloadBtnEl.hidden = !hasPreview;
      generateCanvasEl.hidden = !hasPreview;
      previewEmptyEl.hidden = hasPreview;
      generatePreviewEl.dataset.state = generationState;
      textInputEl.setAttribute('aria-invalid', generationState === 'error' ? 'true' : 'false');
      textHelperEl.textContent = generationState === 'error' ? t.inputRequired : t.inputHelper;
      textHelperEl.dataset.state = generationState === 'error' ? 'error' : '';
      generateStatusEl.dataset.state = generationState;

      if (generationState === 'error') {
        generateStatusEl.textContent = '';
      } else if (generationState === 'generating') {
        generateStatusEl.textContent = t.generating;
      } else if (generationState === 'ready') {
        generateStatusEl.textContent = t.generated(Array.from(generatedText).length);
      } else if (generationState === 'downloaded') {
        generateStatusEl.textContent = t.downloaded;
      } else if (generationState === 'failed') {
        generateStatusEl.textContent = t.generationFailed;
      } else {
        generateStatusEl.textContent = '';
      }
    }

    function renderDecodedResult() {
      if (decodedState === 'success') {
        resultPEl.textContent = texts[lang].decoded + decodedData;
      } else if (decodedState === 'loading') {
        resultPEl.textContent = texts[lang].decoding;
      } else if (decodedState === 'notFound') {
        resultPEl.textContent = texts[lang].notFound;
      } else if (decodedState === 'invalidFile') {
        resultPEl.textContent = texts[lang].invalidFile;
      } else if (decodedState === 'readFailed') {
        resultPEl.textContent = texts[lang].readFailed;
      } else if (decodedState === 'imageFailed') {
        resultPEl.textContent = texts[lang].imageFailed;
      } else {
        resultPEl.textContent = '';
      }
      resultPEl.dataset.state = decodedState;
      dropZoneEl.dataset.state = ['notFound', 'invalidFile', 'readFailed', 'imageFailed'].includes(decodedState)
        ? 'error'
        : decodedState;
      dropZoneEl.setAttribute('aria-busy', decodedState === 'loading' ? 'true' : 'false');
    }

    function setLanguage(newLang) {
      lang = newLang;
      const t = texts[lang];
      document.documentElement.lang = lang;
      document.title = t.title;
      document.getElementById('title').textContent = t.title;
      document.getElementById('gen-title').textContent = t.genTitle;
      document.getElementById('dec-title').textContent = t.decTitle;
      textLabelEl.textContent = t.inputLabel;
      textInputEl.placeholder = t.inputPlaceholder;
      textHelperEl.textContent = t.inputHelper;
      previewEmptyEl.textContent = t.previewEmpty;
      generateCanvasEl.setAttribute('aria-label', t.previewLabel);
      decodeCanvasEl.setAttribute('aria-label', t.decodeCanvasLabel);
      downloadBtnEl.textContent = t.downloadBtn;
      document.getElementById('hint').textContent = t.hint;
      dropZoneTextEl.textContent = t.dropZone;
      dropZoneActionEl.textContent = t.fileBtn;
      fileInputEl.setAttribute('aria-label', t.fileBtn);
      resetBtnEl.textContent = t.resetBtn;
      langBtnEl.textContent = lang === 'ja' ? 'EN' : 'JA';
      langBtnEl.setAttribute('aria-label', t.switchLanguage);
      renderGenerationState();
      renderDecodedResult();
    }

    async function generateQRCode() {
      const text = textInputEl.value;
      if (text.length === 0) {
        generationState = 'error';
        renderGenerationState();
        textInputEl.focus();
        return;
      }

      generationState = 'generating';
      renderGenerationState();
      try {
        await new Promise((resolve, reject) => {
          QRCode.toCanvas(
            generateCanvasEl,
            text,
            { width: 256, margin: 4, errorCorrectionLevel: 'M' },
            error => error ? reject(error) : resolve()
          );
        });
        generatedText = text;
        generationState = 'ready';
      } catch (error) {
        console.error('QR generation failed', error);
        generatedText = '';
        generationState = 'failed';
      }
      renderGenerationState();
    }

    function downloadQRCode() {
      generateCanvasEl.toBlob(blob => {
        if (!blob) {
          generationState = 'failed';
          renderGenerationState();
          return;
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'qrcode.png';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 0);
        generationState = 'downloaded';
        renderGenerationState();
      }, 'image/png');
    }

    function clearDecodeCanvas() {
      decodeCanvasEl.hidden = true;
      decodeCtxEl.clearRect(0, 0, decodeCanvasEl.width, decodeCanvasEl.height);
    }

    function beginDecode() {
      const requestId = ++decodeRequestId;
      clearDecodeCanvas();
      decodedState = 'loading';
      decodedData = '';
      renderDecodedResult();
      return requestId;
    }

    function finishDecode(requestId, state, data = '') {
      if (requestId !== decodeRequestId) return;
      decodedState = state;
      decodedData = data;
      renderDecodedResult();
    }

    function decodeImage(img, requestId) {
      if (requestId !== decodeRequestId) return;
      const sourceWidth = img.naturalWidth || img.width;
      const sourceHeight = img.naturalHeight || img.height;
      if (!sourceWidth || !sourceHeight) {
        finishDecode(requestId, 'imageFailed');
        return;
      }
      const maxDecodeSize = 1600;
      const scale = Math.min(1, maxDecodeSize / sourceWidth, maxDecodeSize / sourceHeight);
      const width = Math.max(1, Math.round(sourceWidth * scale));
      const height = Math.max(1, Math.round(sourceHeight * scale));
      decodeCanvasEl.hidden = false;
      decodeCanvasEl.width = width;
      decodeCanvasEl.height = height;
      decodeCtxEl.clearRect(0, 0, width, height);
      decodeCtxEl.drawImage(img, 0, 0, width, height);
      const data = decodeCtxEl.getImageData(0, 0, width, height);
      const code = jsQR(data.data, data.width, data.height);
      finishDecode(requestId, code ? 'success' : 'notFound', code?.data || '');
    }

    function loadImageSource(source, requestId) {
      const image = new Image();
      image.onload = () => decodeImage(image, requestId);
      image.onerror = () => finishDecode(requestId, 'imageFailed');
      image.src = source;
    }

    function handleFile(file) {
      const requestId = beginDecode();
      if (file.type && !file.type.startsWith('image/')) {
        finishDecode(requestId, 'invalidFile');
        return;
      }
      const reader = new FileReader();
      reader.onload = event => {
        if (typeof event.target?.result !== 'string') {
          finishDecode(requestId, 'readFailed');
          return;
        }
        loadImageSource(event.target.result, requestId);
      };
      reader.onerror = () => finishDecode(requestId, 'readFailed');
      reader.onabort = () => finishDecode(requestId, 'readFailed');
      reader.readAsDataURL(file);
    }

    function handleDataURL(url) {
      const requestId = beginDecode();
      if (!url.startsWith('data:image/')) {
        finishDecode(requestId, 'invalidFile');
        return;
      }
      loadImageSource(url, requestId);
    }

    langBtnEl.addEventListener('click', () => setLanguage(lang === 'ja' ? 'en' : 'ja'));
    generateBtnEl.addEventListener('click', generateQRCode);
    downloadBtnEl.addEventListener('click', downloadQRCode);
    textInputEl.addEventListener('keydown', event => {
      if (event.key === 'Enter') generateQRCode();
    });
    textInputEl.addEventListener('input', () => {
      if (generationState !== 'empty') {
        generatedText = '';
        generationState = 'empty';
        generateCtxEl.clearRect(0, 0, generateCanvasEl.width, generateCanvasEl.height);
        renderGenerationState();
      }
    });
    generateCanvasEl.addEventListener('dragstart', event => {
      event.dataTransfer.setData('text/plain', generateCanvasEl.toDataURL());
    });
    dropZoneEl.addEventListener('dragover', event => {
      event.preventDefault();
      dropZoneEl.classList.add('hover');
    });
    dropZoneEl.addEventListener('dragleave', () => dropZoneEl.classList.remove('hover'));
    dropZoneEl.addEventListener('drop', event => {
      event.preventDefault();
      dropZoneEl.classList.remove('hover');
      const transfer = event.dataTransfer;
      if (transfer.files?.length) {
        handleFile(transfer.files[0]);
      } else {
        handleDataURL(transfer.getData('text/plain'));
      }
    });
    fileInputEl.addEventListener('change', () => {
      const file = fileInputEl.files[0];
      fileInputEl.value = '';
      if (file) handleFile(file);
    });
    resetBtnEl.addEventListener('click', () => {
      decodeRequestId += 1;
      textInputEl.value = '';
      generatedText = '';
      generationState = 'empty';
      generateCtxEl.clearRect(0, 0, generateCanvasEl.width, generateCanvasEl.height);
      clearDecodeCanvas();
      decodedState = 'empty';
      decodedData = '';
      fileInputEl.value = '';
      renderGenerationState();
      renderDecodedResult();
    });
    setLanguage(lang);
  </script>
</body>
</html>
